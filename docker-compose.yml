version: '3.9'

services:

  frontend:
    build: ./apps/frontend

    ports:
      - "3000:3000"

    volumes:
      - ./apps/frontend:/app

    depends_on:
      - backend

  backend:
    build: ./apps/backend

    ports:
      - "8000:8000"

    volumes:
      - ./apps/backend:/app

    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ats_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio

    container_name: minio

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    volumes:
      - minio_data:/data

  redis:
    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"

volumes:
  postgres_data:
  minio_data: