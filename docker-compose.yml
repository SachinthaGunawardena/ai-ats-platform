version: '3.9'

services:

  frontend:
    build: ./apps/frontend

    ports:
      - "3000:3000"

    volumes:
      - ./apps/frontend:/app

    depends_on:
      - backend

  backend:
    build: ./apps/backend

    ports:
      - "8000:8000"

    volumes:
      - ./apps/backend:/app

    depends_on:
      - postgres

  postgres:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ats_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: